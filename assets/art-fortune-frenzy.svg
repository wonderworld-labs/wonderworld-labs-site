<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18181b" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#d1fae5"/>
  <!-- Sticky Green Balance Bar -->
  <g transform="translate(70 38)" filter="url(#s)">
    <rect width="500" height="68" rx="10" fill="#2ecc71"/>
    <text x="250" y="45" font-family="system-ui,sans-serif" font-size="33" font-weight="800" fill="#ffffff" text-anchor="middle">$100,000,000,000</text>
  </g>
  <!-- Product Card 1 -->
  <g transform="translate(70 128)" filter="url(#s)">
    <rect width="238" height="230" rx="10" fill="#ffffff"/>
    <circle cx="119" cy="64" r="38" fill="#fef3c7"/>
    <text x="119" y="78" font-family="system-ui,sans-serif" font-size="42" text-anchor="middle">🍔</text>
    <text x="119" y="132" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="#333333" text-anchor="middle">Big Mac</text>
    <text x="119" y="158" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#24c486" text-anchor="middle">$2</text>
    <rect x="16" y="176" width="62" height="36" rx="4" fill="#f53b57"/>
    <text x="47" y="199" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Sell</text>
    <rect x="86" y="176" width="66" height="36" rx="4" fill="#ffffff" stroke="#b2bec3"/>
    <text x="119" y="199" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#333333" text-anchor="middle">42</text>
    <rect x="160" y="176" width="62" height="36" rx="4" fill="#2ecc71"/>
    <text x="191" y="199" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Buy</text>
  </g>
  <!-- Product Card 2 -->
  <g transform="translate(332 128)" filter="url(#s)">
    <rect width="238" height="230" rx="10" fill="#ffffff"/>
    <circle cx="119" cy="64" r="38" fill="#e0f2fe"/>
    <text x="119" y="78" font-family="system-ui,sans-serif" font-size="42" text-anchor="middle">🛥️</text>
    <text x="119" y="132" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="#333333" text-anchor="middle">Yacht</text>
    <text x="119" y="158" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#24c486" text-anchor="middle">$7,500,000</text>
    <rect x="16" y="176" width="62" height="36" rx="4" fill="#f1f2f6"/>
    <text x="47" y="199" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#333333" text-anchor="middle">Sell</text>
    <rect x="86" y="176" width="66" height="36" rx="4" fill="#ffffff" stroke="#b2bec3"/>
    <text x="119" y="199" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#333333" text-anchor="middle">0</text>
    <rect x="160" y="176" width="62" height="36" rx="4" fill="#2ecc71"/>
    <text x="191" y="199" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Buy</text>
  </g>
</svg>
