<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#fffdf9"/>
  <!-- Tracks -->
  <g stroke="#111" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M 30 215 L 245 215"/>
    <path d="M 30 250 L 245 250"/>
    <!-- Upper track -->
    <path d="M 245 215 C 310 215, 340 135, 415 135 L 610 135"/>
    <path d="M 245 250 C 310 250, 340 170, 415 170 L 610 170"/>
    <!-- Lower track -->
    <path d="M 245 215 C 310 215, 340 265, 415 265 L 610 265"/>
    <path d="M 245 250 C 310 250, 340 300, 415 300 L 610 300"/>
  </g>
  <!-- Red Runaway Trolley -->
  <g transform="translate(135, 200)">
    <line x1="-80" y1="-22" x2="-55" y2="-22" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <line x1="-92" y1="-4" x2="-60" y2="-4" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <rect x="-50" y="-42" width="104" height="54" rx="10" fill="#e63946" stroke="#111" stroke-width="5"/>
    <rect x="-38" y="-30" width="22" height="20" rx="3" fill="#fffdf9" stroke="#111" stroke-width="3.5"/>
    <rect x="-8" y="-30" width="22" height="20" rx="3" fill="#fffdf9" stroke="#111" stroke-width="3.5"/>
    <rect x="22" y="-30" width="22" height="20" rx="3" fill="#fffdf9" stroke="#111" stroke-width="3.5"/>
    <circle cx="-28" cy="18" r="10" fill="#222" stroke="#111" stroke-width="4"/>
    <circle cx="28" cy="18" r="10" fill="#222" stroke="#111" stroke-width="4"/>
  </g>
  <!-- Lever and stick figure -->
  <g transform="translate(245, 330)" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M -20 20 L 20 20 L 12 6 L -12 6 Z" fill="#222"/>
    <line x1="0" y1="8" x2="14" y2="-32"/>
    <circle cx="15" cy="-35" r="7" fill="#e63946"/>
  </g>
  <!-- Stick figures on tracks -->
  <g transform="translate(495, 138)" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="0" cy="-14" r="9" fill="#fff"/>
    <line x1="0" y1="-5" x2="0" y2="18"/>
    <line x1="-10" y1="5" x2="10" y2="5"/>
  </g>
  <g transform="translate(465, 268)" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="0" cy="-14" r="9" fill="#fff"/><line x1="0" y1="-5" x2="0" y2="18"/><line x1="-10" y1="5" x2="10" y2="5"/>
    <circle cx="30" cy="-14" r="9" fill="#fff"/><line x1="30" y1="-5" x2="30" y2="18"/><line x1="20" y1="5" x2="40" y2="5"/>
    <circle cx="60" cy="-14" r="9" fill="#fff"/><line x1="60" y1="-5" x2="60" y2="18"/><line x1="50" y1="5" x2="70" y2="5"/>
  </g>
  <!-- Title Banner -->
  <text x="320" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#111">Absurd Trolley Problems</text>
</svg>
