<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#18181b" flood-opacity=".12"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#18181b" opacity=".1"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="#f8fafc"/>
  <rect width="640" height="400" fill="url(#dots)"/>
  <!-- Connection curves -->
  <path d="M210 120 C270 120, 260 195, 320 195" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M210 270 C270 270, 260 195, 320 195" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M390 195 L455 195" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
  <!-- Water Pill -->
  <g transform="translate(75 92) rotate(-4)" filter="url(#s)">
    <rect width="145" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="32" cy="26" r="13" fill="#38bdf8"/>
    <text x="56" y="33" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#0f172a">Water</text>
  </g>
  <!-- Fire Pill -->
  <g transform="translate(82 242) rotate(3)" filter="url(#s)">
    <rect width="135" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="32" cy="26" r="13" fill="#f97316"/>
    <text x="56" y="33" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#0f172a">Fire</text>
  </g>
  <!-- Steam Pill -->
  <g transform="translate(252 168)" filter="url(#s)">
    <rect width="150" height="54" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <circle cx="33" cy="27" r="13" fill="#94a3b8"/>
    <text x="58" y="34" font-family="system-ui,sans-serif" font-size="21" font-weight="700" fill="#0f172a">Steam</text>
  </g>
  <!-- Dragon First Discovery Pill -->
  <g transform="translate(425 154) rotate(2)" filter="url(#s)">
    <rect width="165" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="35" cy="30" r="14" fill="#10b981"/>
    <text x="58" y="37" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#0f172a">Dragon</text>
    <rect x="24" y="68" width="118" height="22" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="83" y="83" font-family="system-ui,sans-serif" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">✨ First Discovery</text>
  </g>
</svg>
