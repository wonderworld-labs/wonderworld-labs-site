<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18181b" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="#fffae9"/>
  <!-- Password Input Box -->
  <g transform="translate(95 48)" filter="url(#s)">
    <rect width="450" height="68" rx="12" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.5"/>
    <text x="24" y="43" font-family="monospace" font-size="26" font-weight="700" fill="#1c1c1c">P@ssw0rdVII🥚🔥</text>
    <text x="415" y="42" font-family="system-ui,sans-serif" font-size="18" font-weight="600" fill="#7c776e" text-anchor="end">14</text>
  </g>
  <!-- Red Unsatisfied Rule Card -->
  <g transform="translate(95 140) rotate(-1.5 225 50)" filter="url(#s)">
    <rect width="450" height="96" rx="11" fill="#ffecec" stroke="#ff4d4d" stroke-width="2"/>
    <path d="M0 11 Q0 0 11 0 L439 0 Q450 0 450 11 L450 36 L0 36 Z" fill="#ffc2c2"/>
    <text x="18" y="24" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#8c1919">✕ Rule 17</text>
    <text x="18" y="68" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#1c1c1c">🥚 This is my chicken Paul. Please keep him safe.</text>
  </g>
  <!-- Green Satisfied Rule Card -->
  <g transform="translate(95 256) rotate(1 225 45)" filter="url(#s)">
    <rect width="450" height="88" rx="11" fill="#e3f9e5" stroke="#28a745" stroke-width="2"/>
    <path d="M0 11 Q0 0 11 0 L439 0 Q450 0 450 11 L450 34 L0 34 Z" fill="#aef0b5"/>
    <text x="18" y="23" font-family="system-ui,sans-serif" font-size="15" font-weight="800" fill="#145a23">✓ Rule 5</text>
    <text x="18" y="64" font-family="system-ui,sans-serif" font-size="17" font-weight="600" fill="#1c1c1c">The digits in your password must add up to 25.</text>
  </g>
