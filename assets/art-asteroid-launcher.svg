<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#0b101b"/>
  <!-- Map Grid -->
  <g stroke="rgba(148,163,184,0.12)" stroke-width="1.5">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="128" y1="0" x2="128" y2="400"/>
    <line x1="256" y1="0" x2="256" y2="400"/>
    <line x1="384" y1="0" x2="384" y2="400"/>
    <line x1="512" y1="0" x2="512" y2="400"/>
  </g>
  <!-- Concentric Shockwave Rings -->
  <circle cx="290" cy="225" r="145" fill="rgba(56,189,248,0.14)" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="290" cy="225" r="102" fill="rgba(247,184,1,0.22)" stroke="#f7b801" stroke-width="2.5"/>
  <circle cx="290" cy="225" r="60" fill="rgba(255,107,53,0.38)" stroke="#ff6b35" stroke-width="3"/>
  <circle cx="290" cy="225" r="22" fill="#ffffff"/>
  <!-- Incoming Asteroid Trail -->
  <path d="M 520 35 L 305 212" stroke="#ff6b35" stroke-width="14" stroke-linecap="round"/>
  <path d="M 535 52 L 325 224" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/>
  <circle cx="305" cy="212" r="24" fill="#94a3b8" stroke="#ff3b5c" stroke-width="4"/>
  <text x="320" y="56" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#ffffff">Asteroid Launcher</text>
</svg>
