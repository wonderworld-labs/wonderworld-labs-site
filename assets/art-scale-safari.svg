<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0d9488" stroke-width="1" stroke-opacity="0.11"/>
    </pattern>
  </defs>

  <!-- Background & Precision Scale Grid -->
  <rect width="640" height="400" fill="url(#sky)"/>
  <rect width="640" height="400" fill="url(#grid)"/>

  <!-- Top Scale Pill Badge -->
  <rect x="230" y="24" width="180" height="34" rx="17" fill="#18181b"/>
  <text x="320" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="1.2">1 : 2.97 SCALE</text>

  <!-- Baseline & Ruler Marks -->
  <line x1="48" y1="332" x2="592" y2="332" stroke="#0f766e" stroke-width="3"/>
  <g stroke="#0f766e" stroke-width="2" opacity="0.6">
    <line x1="80" y1="332" x2="80" y2="342"/><line x1="160" y1="332" x2="160" y2="342"/>
    <line x1="240" y1="332" x2="240" y2="342"/><line x1="320" y1="332" x2="320" y2="342"/>
    <line x1="400" y1="332" x2="400" y2="342"/><line x1="480" y1="332" x2="480" y2="342"/>
    <line x1="560" y1="332" x2="560" y2="342"/>
  </g>

  <!-- Vertical Height Guide Bars -->
  <line x1="78" y1="218" x2="78" y2="332" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="78" y="208" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0369a1">1.75 m</text>

  <line x1="226" y1="84" x2="226" y2="332" stroke="#d97706" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="226" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#b45309">5.2 m</text>

  <!-- 1. Realistic Adult Human (Left Reference) -->
  <g transform="translate(88, 216)">
    <ellipse cx="26" cy="116" rx="18" ry="3.5" fill="rgba(0,0,0,0.12)"/>
    <!-- Legs -->
    <path d="M18 68 L15 110 L22 110 L25 76 L27 76 L30 110 L37 110 L34 68 Z" fill="#1e3a8a"/>
    <rect x="13" y="109" width="10" height="5" rx="2" fill="#0f172a"/>
    <rect x="29" y="109" width="10" height="5" rx="2" fill="#0f172a"/>
    <!-- Jacket & Shirt -->
    <path d="M14 34 Q26 30 38 34 L41 68 Q26 71 11 68 Z" fill="#ef4444"/>
    <rect x="23" y="34" width="6" height="34" fill="#ffffff"/>
    <!-- Arms -->
    <path d="M14 35 L7 62 L12 64 L17 42 Z" fill="#dc2626"/>
    <path d="M38 35 L45 62 L40 64 L35 42 Z" fill="#dc2626"/>
    <!-- Head -->
    <circle cx="26" cy="18" r="10" fill="#f1c27d"/>
    <path d="M16 17 Q16 7 26 7 Q36 7 36 17 Q31 12 21 13 Z" fill="#27272a"/>
  </g>
  <text x="114" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Human (1.75 m)</text>

  <!-- 2. Realistic Reticulated Giraffe (Center) -->
  <g transform="translate(172, 76)">
    <ellipse cx="82" cy="256" rx="54" ry="5" fill="rgba(0,0,0,0.12)"/>
    <!-- Back Legs -->
    <path d="M46 168 L40 255 L48 255 L55 170 Z" fill="#d97706"/>
    <path d="M104 168 L100 255 L108 255 L112 170 Z" fill="#d97706"/>
    <!-- Body & Long Neck -->
    <path d="M38 145 Q62 124 114 134 L144 18 L158 18 L132 156 Q126 176 104 174 L48 172 Q35 164 38 145 Z" fill="#f59e0b"/>
    <!-- Near Legs & Hooves -->
    <path d="M56 168 L52 255 L60 255 L66 170 Z" fill="#fbbf24"/>
    <path d="M114 166 L114 255 L122 255 L124 168 Z" fill="#fbbf24"/>
    <rect x="39" y="250" width="9" height="6" fill="#1c1917"/>
    <rect x="51" y="250" width="9" height="6" fill="#1c1917"/>
    <rect x="99" y="250" width="9" height="6" fill="#1c1917"/>
    <rect x="113" y="250" width="9" height="6" fill="#1c1917"/>
    <!-- Giraffe Head & Ossicones -->
    <path d="M145 18 L142 6 M153 18 L153 6" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <circle cx="142" cy="6" r="3" fill="#451a03"/><circle cx="153" cy="6" r="3" fill="#451a03"/>
    <path d="M142 14 L172 20 Q176 28 164 31 L145 28 Z" fill="#fbbf24"/>
    <circle cx="157" cy="21" r="2.2" fill="#1c1917"/>
    <!-- Spots -->
    <g fill="#92400e" opacity="0.85">
      <polygon points="52,142 68,138 72,152 55,155"/>
      <polygon points="78,136 96,140 93,155 75,153"/>
      <polygon points="100,142 116,146 112,162 98,159"/>
      <polygon points="65,158 85,158 82,169 62,167"/>
      <polygon points="120,120 131,114 134,128 123,132"/>
      <polygon points="128,92 138,86 140,100 130,105"/>
      <polygon points="135,62 145,56 147,70 137,74"/>
      <polygon points="141,36 149,32 151,45 143,48"/>
    </g>
    <!-- Tail -->
    <path d="M38 148 Q26 176 30 202" stroke="#92400e" stroke-width="3" fill="none"/>
    <ellipse cx="30" cy="205" rx="3.5" ry="7" fill="#451a03"/>
  </g>
  <text x="256" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Giraffe (5.2 m)</text>

  <!-- 3. Realistic African Elephant (Right) -->
  <g transform="translate(352, 134)">
    <ellipse cx="116" cy="198" rx="98" ry="6" fill="rgba(0,0,0,0.14)"/>
    <!-- Floating Resize Target Badge -->
    <rect x="74" y="6" width="84" height="28" rx="14" fill="#ea580c"/>
    <text x="116" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff">6.1 m ⇕</text>
    <!-- Back Legs -->
    <rect x="44" y="132" width="24" height="65" rx="6" fill="#475569"/>
    <rect x="136" y="132" width="24" height="65" rx="6" fill="#475569"/>
    <!-- Body -->
    <path d="M22 108 Q26 48 92 44 Q156 42 184 68 L180 148 Q108 158 30 144 Z" fill="#64748b"/>
    <!-- Front Legs & Toenails -->
    <rect x="30" y="128" width="26" height="69" rx="7" fill="#64748b"/>
    <rect x="150" y="128" width="26" height="69" rx="7" fill="#64748b"/>
    <g fill="#cbd5e1">
      <circle cx="36" cy="195" r="3.5"/><circle cx="44" cy="195" r="3.5"/><circle cx="51" cy="195" r="3.5"/>
      <circle cx="156" cy="195" r="3.5"/><circle cx="164" cy="195" r="3.5"/><circle cx="171" cy="195" r="3.5"/>
    </g>
    <!-- Head & Trunk -->
    <path d="M168 54 Q208 48 218 82 Q228 122 224 162 Q220 178 206 174 Q200 168 206 160 Q212 130 202 106 L172 114 Z" fill="#64748b"/>
    <!-- Large Ear -->
    <path d="M144 50 Q186 46 190 92 Q178 128 148 114 Q136 84 144 50 Z" fill="#475569"/>
    <!-- Curved Ivory Tusk -->
    <path d="M194 106 Q230 116 244 92 Q228 130 190 120 Z" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="200" cy="80" r="3" fill="#0f172a"/>
    <!-- Tail -->
    <path d="M24 94 Q8 120 12 146" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <text x="468" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ea580c">African Elephant (6.1 m)</text>
</svg>
